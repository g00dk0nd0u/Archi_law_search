<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>建築法規検索</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=23f76ba">
</head>
<body>
  <div class="page-header">
    <h1>建築法規検索</h1>
    <div class="header-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="テーマ切替" title="ダークモードに切替">
        <span class="theme-toggle-icon" aria-hidden="true">☾</span>
      </button>
    </div>
  </div>

  <main>
    <section class="search-form" aria-label="検索条件">
      <div class="search-row">
        <label class="field is-number-query">
          <span id="number-label">条番号</span>
          <input id="number-query" type="search" autocomplete="off" placeholder="例: 112">
        </label>

        <label class="field is-main-query">
          <span>検索キーワード</span>
          <input id="keyword-query" type="search" autocomplete="off" placeholder="例: 防火、容積率、準耐火">
        </label>

        <label class="field is-law-filter" id="law-filter-field">
          <span>法令名</span>
          <select id="law-title-filter">
            <option value="">全法令</option>
          </select>
        </label>

        <div class="source-switch-wrap">
          <div class="source-switch-label">検索対象</div>
          <div class="source-switch" role="tablist" aria-label="検索対象">
            <button class="source-option active" type="button" data-source="law">法令</button>
            <button class="source-option" type="button" data-source="kokuji">告示</button>
          </div>
        </div>

        <button id="search-button" type="button" class="search-submit">検索</button>
      </div>
    </section>

    <div class="meta" aria-live="polite">
      <strong id="result-count">0件ヒット</strong>
      <div class="meta-actions">
        <span id="status">読み込み中</span>
        <button type="button" class="text-download-button" disabled>TXT保存</button>
      </div>
    </div>

    <section id="results" class="results-area" aria-label="検索結果">
      <div class="empty">読み込み中です。</div>
    </section>
  </main>

  <script src="app.js?v=23f76ba" defer></script>
</body>
</html>
